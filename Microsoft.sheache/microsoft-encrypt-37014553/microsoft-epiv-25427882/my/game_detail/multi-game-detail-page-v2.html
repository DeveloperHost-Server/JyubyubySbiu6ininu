    <style>
        :root {
            --bg-color: #050508;
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --text-muted: #55556a;
            --accent: #0070ff;
            --accent-secondary: #00c8ff;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --card-bg: #12121a;
            --glass-border: rgba(255, 255, 255, 0.08);
            --card-bg-hover: #1a1a26;
            --coming-soon-color: #ffaa00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #333 var(--bg-color); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .ambient-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }
        .ambient-orb {
            position: absolute; border-radius: 50%;
            filter: blur(120px); opacity: 0.12;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .ambient-orb:nth-child(1) { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -100px; }
        .ambient-orb:nth-child(2) { width: 500px; height: 500px; background: #6b00ff; top: 50%; right: -150px; animation-delay: -7s; animation-duration: 25s; }
        .ambient-orb:nth-child(3) { width: 400px; height: 400px; background: var(--accent-secondary); bottom: -100px; left: 30%; animation-delay: -14s; animation-duration: 22s; }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            25% { transform: translate(50px,-30px) scale(1.1); }
            50% { transform: translate(-20px,40px) scale(0.95); }
            75% { transform: translate(30px,20px) scale(1.05); }
        }
        .noise-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            z-index:1; pointer-events:none; opacity:0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
        }

        nav {
            position: fixed; top:0; left:0; right:0;
            z-index: 1000; padding: 0 5%; height: 64px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5,5,8,0.6);
            backdrop-filter: blur(20px) saturate(1.5);
            border-bottom: 1px solid var(--glass-border);
        }
        .logo {
            font-size: 1.3rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #8888a0 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            text-decoration: none;
        }
        .nav-links { display: flex; align-items: center; }
        .nav-links a {

        .nav-cta {

            font-weight: 600 !important;
            box-shadow: 0 2px 12px rgba(0,112,255,0.2);
        }

        main {
            position: relative; z-index: 2;
            max-width: 1200px; margin: 0 auto; padding: 84px 5% 2rem;

        .game-selector {

            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 2rem;
        }
        .game-selector__item {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .game-selector__item:hover {
            border-color: var(--border-hover);
            background: var(--card-bg-hover);
            transform: translateY(-2px);
        }
        .game-selector__item.active {
            border-color: var(--accent-secondary);
            background: rgba(0, 200, 255, 0.08);
            color: var(--accent-secondary);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.1);
        }
        .game-selector__item img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border);
        }
        .game-selector__item .name {
            font-size: 0.7rem;
            font-weight: 600;
            line-height: 1.2;
        }

          ===== */


        /* ===== HERO ===== */
        .hero {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            min-height: 460px;
            border: 1px solid var(--glass-border);
            background: var(--card-bg);
            margin-bottom: 2.5rem;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .hero--loading {
            opacity: 0;
            transform: translateY(20px);
        }
        .hero--loaded {
            opacity: 1;
            transform: translateY(0);
        }
        .hero-bg {
            position: absolute; inset: 0; overflow: hidden;
        }
        .hero-bg img {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.45) saturate(1.1);
            transform: scale(1.02);
            transition: transform 8s ease;
        }
        .hero:hover .hero-bg img {
            transform: scale(1.06);
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(5,5,8,0.97) 0%, rgba(5,5,8,0.6) 30%, rgba(5,5,8,0.2) 60%, rgba(5,5,8,0.5) 100%);
            z-index: 1;
        }
        .hero-content {
            position: relative; z-index: 2;
            padding: 3rem 3.5rem;
            display: flex; flex-direction: column;
            justify-content: flex-end;
            min-height: 460px;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 4px 14px; background: rgba(0,112,255,0.12);
            border: 1px solid rgba(0,112,255,0.2); border-radius: 20px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--accent-secondary);
            width: fit-content; backdrop-filter: blur(8px);
            margin-bottom: 1rem;
        }
        .hero-badge .dot {
            width: 6px; height: 6px; background: #00ff88; border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(0,255,136,0.4); } 50% { opacity:0.8; box-shadow:0 0 0 6px rgba(0,255,136,0); } }

        .hero-title {
            font-size: 3rem; font-weight: 900; line-height: 1.08;
            margin-bottom: 0.5rem; letter-spacing: -1px;
            max-width: 640px;
        }
        .hero-sub {
            color: var(--text-secondary); max-width: 540px;

        }
        .hero-meta {
            display: flex; flex-wrap: wrap; gap: 1.2rem 2rem; margin-bottom: 1.8rem;
        }
        .hero-meta-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; color: var(--text-muted);
        }
        .hero-meta-item i { color: var(--accent-secondary); width: 18px; text-align: center; }
        .hero-meta-item strong { color: var(--text-primary); font-weight: 600; }
        .rating .stars { color: #ffc107; font-size: 0.85rem; letter-spacing: 2px; }
        .rating .count { color: var(--text-muted); font-size: 0.75rem; }

        .hero-actions {

        }

        }

        }
        .price-tag.paid {

        }

        .btn {

        }
        .btn-success {

            color: white; box-shadow: 0 4px 20px rgba(0,204,102,0.3);
        }

        .btn-primary {

        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,112,255,0.45); }
        .btn-ghost {

        .btn-lg { padding: 16px 36px; font-size: 1rem; border-radius: 12px; }
        .btn-sm { padding: 8px 18px; font-size: 0.8rem; border-radius: 8px; }

        /* ===== PLATFORM GRID ===== */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 420px;
            margin: 1.5rem 0 1rem;
        }
        .platform-btn {
            padding: 12px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .platform-btn i {
            font-size: 1.3rem;
            color: var(--text-muted);
            transition: color 0.3s;
        }
        .platform-btn:hover:not(:disabled) {
            border-color: var(--border-hover);
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
        }
        .platform-btn.active {
            border-color: rgba(0,200,255,0.4);
            background: rgba(0,112,255,0.08);
            color: var(--accent-secondary);
        }
        .platform-btn.active i {
            color: var(--accent-secondary);
        }

        /* Disabled / Coming Soon State */
        .platform-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            border-color: var(--border);
            background: rgba(255,255,255,0.02);
            filter: grayscale(0.3);
        }
        .platform-btn:disabled:hover {
            transform: none;
            border-color: var(--border);
            background: rgba(255,255,255,0.02);
        }
        .platform-btn:disabled i {
            color: var(--text-muted);
        }

        .platform-status {
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1px 6px;
            border-radius: 3px;
            background: rgba(0, 255, 170, 0.12);
            color: #00cc66;
        }
        .platform-status.coming-soon {
            background: rgba(255, 170, 0, 0.15);
            color: var(--coming-soon-color);
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .download-row {
            display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;

        .feature-card:hover {

        .feature-card i {
            color: var(--accent-secondary);
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        }

            background: rgba(5,5,8,0.9); border-top: 1px solid var(--border);

        .footer-links a:hover { color: var(--text-primary); }
        .footer-socials { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.2rem; }
        .footer-socials a {
            width: 36px; height: 36px; border-radius: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); text-decoration: none; transition: all 0.3s;
        }
        .footer-socials a:hover { background: rgba(0,112,255,0.15); border-color: rgba(0,112,255,0.3); color: var(--accent-secondary); transform: translateY(-2px); }
        footer p { color: var(--text-muted); font-size: 0.8rem; }

        @media (max-width: 768px) {
            .hero-content { padding: 2rem 1.5rem; min-height: 380px; }
            .hero-title { font-size: 2rem; }
            .hero-sub { font-size: 0.9rem; }
            .price-tag { font-size: 1.2rem; }
            .platform-grid { max-width: 100%; }
            .nav-links a:not(.nav-cta) { display: none; }
            .hero-meta { gap: 0.8rem 1.2rem; }
            .hero-actions { flex-direction: column; align-items: stretch; }
            .hero-actions .btn { justify-content: center; }
            .game-selector { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
            .game-selector__item img { width: 36px; height: 36px; }
        }
        @media (max-width: 480px) {
            .hero-title { font-size: 1.6rem; }
            .game-selector { grid-template-columns: repeat(3, 1fr); }
            .game-selector__item .name { font-size: 0.6rem; }
            .platform-grid { grid-template-columns: 1fr; max-width: 200px; }
        }
    </style>
</head>

        // ================================================
        // ⭐ DOM REFS
        // ================================================
        const selector = document.getElementById('gameSelector');
        const hero = document.getElementById('heroContainer');
        const heroImg = document.getElementById('heroImage');
        const heroBadgeText = document.getElementById('heroBadgeText');
        const heroTitle = document.getElementById('heroTitle');
        const heroSub = document.getElementById('heroSub');
        const metaGenre = document.getElementById('metaGenre');
        const metaPlayers = document.getElementById('metaPlayers');
        const metaRelease = document.getElementById('metaRelease');
        const metaRatingCount = document.getElementById('metaRatingCount');
        const priceTag = document.getElementById('priceTag');
        const sizeBadge = document.getElementById('sizeBadge');
        const featuresGrid = document.getElementById('featuresGrid');
        const downloadBtn = document.getElementById('downloadBtn');

        // ================================================
        // ⭐ RENDER GAME SELECTOR
        // ================================================
        function renderSelector(activeId) {
            selector.innerHTML = GAMES.map(g => `
                <div class="game-selector__item ${g.id === activeId ? 'active' : ''}" data-game="${g.id}">
                    <img src="${g.image}" alt="${g.name}" loading="lazy">
                    <span class="name">${g.name}</span>
                </div>
            `).join('');

            selector.querySelectorAll('.game-selector__item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.game;
                    history.pushState(null, '', `#${id}`);
                    loadGame(id);
                });
            });
        }

        // ================================================
        // ⭐ LOAD GAME DATA
        // ================================================
        function loadGame(gameId) {
            const game = GAMES.find(g => g.id === gameId);
            if (!game) {
                const fallback = GAMES[0];
                if (fallback) loadGame(fallback.id);
                return;
            }

            hero.classList.remove('hero--loaded');
            hero.classList.add('hero--loading');

            setTimeout(() => {
                heroImg.src = game.image;
                heroImg.alt = game.name;
                heroBadgeText.textContent = game.badge;
                heroTitle.textContent = game.name;
                heroSub.textContent = game.description;
                metaGenre.textContent = game.genre;
                metaPlayers.textContent = game.players;
                metaRelease.textContent = game.release;
                metaRatingCount.textContent = `(${game.ratingCount})`;

                if (game.price === 0) {
                    priceTag.className = 'price-tag free';
                    priceTag.innerHTML = '<i class="fas fa-gift" style="font-size:1rem;margin-right:6px;"></i>Free';
                } else {
                    priceTag.className = 'price-tag paid';
                    priceTag.textContent = game.priceLabel;
                }

                sizeBadge.innerHTML = `<i class="fas fa-hdd"></i> ${game.size}`;

                featuresGrid.innerHTML = game.features.map(f => `
                    <div class="feature-card">
                        <i class="fas fa-check-circle"></i>
                        <span>${f}</span>
                    </div>
                `).join('');

                // Download button always says Windows
                downloadBtn.innerHTML = `<i class="fab fa-windows"></i> Download for Windows`;

                renderSelector(game.id);

                hero.classList.remove('hero--loading');
                hero.classList.add('hero--loaded');

                if (window.location.hash !== `#${game.id}`) {
                    history.pushState(null, '', `#${game.id}`);
                }
            }, 150);
        }

        // ================================================
        // ⭐ REDIRECTION (EXACT Store.html pattern)
        // ================================================
        function getCheckoutUrl() {
            const currentId = window.location.hash.replace('#', '') || GAMES[0]?.id;
            const game = GAMES.find(g => g.id === currentId);
            return game?.redirectUrl || 'http://127.0.0.1:5000';
        }

        const checkoutBtn = document.getElementById('downloadBtn');
        if (checkoutBtn) {
            const newBtn = checkoutBtn.cloneNode(true);
            checkoutBtn.parentNode.replaceChild(newBtn, checkoutBtn);

            newBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const targetUrl = getCheckoutUrl();
                if (targetUrl) {
                    window.top.location.href = targetUrl;
                }
            });
        }

        // ================================================
        // ⭐ HASH CHANGE & INIT
        // ================================================
        function handleHashChange() {
            const hash = window.location.hash.replace('#', '');
            if (hash) {
                const game = GAMES.find(g => g.id === hash);
                if (game) {
                    loadGame(game.id);
                    return;
                }
            }
            if (GAMES.length) {
                loadGame(GAMES[0].id);
            }
        }

        window.addEventListener('hashchange', handleHashChange);
        window.addEventListener('popstate', handleHashChange);
        handleHashChange();

        console.log('🎮 Multi-game detail page (Windows + Coming Soon) loaded!');
        console.log(`📦 ${GAMES.length} games available`);
        console.log('💡 Use #game-id in URL to switch games');
    </script>
